version: "3"

volumes:
  node_modules:
services:
  appeal-app-dev:
    container_name: mps_client_dev
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    ports:
      - "3000:3000"
      - "24678:24678"
    volumes:
      - .:/src
      - node_modules:/src/node_modules
    develop:
      watch:
        - action: sync
          path: .
          target: /msp